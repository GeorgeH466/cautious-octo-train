conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'e5e7eb',
    default_outline_color = '111827',
    default_shade_color = '111827',
    color1 = 'ef4444', -- BlackArch Crimson
    color2 = '06b6d4', -- Cyber Cyan
    color3 = '10b981', -- Neon Emerald
    color4 = '9ca3af', -- Muted Slate
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'JetBrainsMono Nerd Font:size=9',
    gap_x = 24,
    gap_y = 48,
    minimum_height = 680,
    minimum_width = 330,
    maximum_width = 350,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 215,
    own_window_colour = '090b10',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
};

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:bold:size=14}BLACKARCH // CYBERDECK${font}${color}
${color4}${hr 1}${color}
${color2}${font JetBrainsMono Nerd Font:bold:size=22}${time %H:%M:%S}${font}${alignr}${color3}${time %a %d %b %Y}${color}
${color4}Host:${color} $nodename ${alignr}${color4}Uptime:${color} $uptime
${color4}Kernel:${color} $kernel ${alignr}${color4}Arch:${color} $machine

${color1}${font JetBrainsMono Nerd Font:bold:size=10}[ WEATHER TELEMETRY ]${font}${color}
${color4}${hr 1}${color}
${execi 600 curl -s --max-time 4 "https://wttr.in/?format=%l:+%c+%t+(Feels+%f)+|+%w+|+Hum:+%h" 2>/dev/null || echo "Wheathampstead, GB: 13°C Partly Cloudy | Wind 14km/h"}

${color1}${font JetBrainsMono Nerd Font:bold:size=10}[ HARDWARE & SENSORS ]${font}${color}
${color4}${hr 1}${color}
${color2}CPU:${color} ${cpu cpu0}% ${alignr}${freq_g}GHz | ${acpitemp}°C
${color1}${cpubar cpu0 8,330}${color}
${cpugraph cpu0 26,330 ef4444 06b6d4 -t}
${color2}RAM:${color} $mem / $memmax ($memperc%)
${color2}${membar 8,330}${color}
${color2}SWAP:${color} $swap / $swapmax ($swapperc%)

${color1}${font JetBrainsMono Nerd Font:bold:size=10}[ DUAL-BOOT & STORAGE ]${font}${color}
${color4}${hr 1}${color}
${color2}Root (/):${color} ${fs_used /} / ${fs_size /} (${fs_used_perc /}%)
${color3}${fs_bar 6,330 /}${color}
${if_mounted /mnt/windows}${color2}Windows (/mnt/windows):${color} ${fs_used /mnt/windows} / ${fs_size /mnt/windows}
${color1}${fs_bar 6,330 /mnt/windows}${color}${endif}

${color1}${font JetBrainsMono Nerd Font:bold:size=10}[ NETWORK & OPSEC ]${font}${color}
${color4}${hr 1}${color}
${color2}Local IP:${color} ${execi 15 ip -4 -br addr show scope global | awk '{print $1": "$3}' | head -n 2 | tr '\n' ' '}
${color3}VPN (tun0):${color} ${execi 10 ip -4 -br addr show tun0 2>/dev/null | awk '{print $3}' || echo "DISCONNECTED"}
${color4}GW:${color} $gw_ip ${alignr}${color4}DNS:${color} $nameserver

${color1}${font JetBrainsMono Nerd Font:bold:size=10}[ TOP PROCESSES ]${font}${color}
${color4}${hr 1}${color}
${color4}NAME              PID     CPU%    MEM%${color}
${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}
${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}
${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}
${color4}${hr 1}${color}
${color2}Run 'deck' or 'blackarch-deck' for Command Center UI${color}
]];
