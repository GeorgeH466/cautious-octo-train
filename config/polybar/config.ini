; ════════════════════════════════════════════════════════════════════════
;  CYBERDECK // Polybar — spaceship HUD (top: ops · bottom: vitals)
;  Includes ~/.cyberdeck/current-theme.env values via launch.sh -defaults below are Ghost.
; ════════════════════════════════════════════════════════════════════════
[colors]
background = #e60a0a0a
background-alt = #ff10161a
foreground = #e6ffff
primary = #00fff5
secondary = #00b8b0
accent = #7dfff8
green = #00ff41
amber = #ffb000
alert = #ff0040
muted = #3d7a78
line = #1a2a2a

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/cyber-top]
monitor = ${env:MONITOR:}
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 1
line-color = ${colors.primary}
border-bottom-size = 1
border-color = ${colors.line}
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=13;3"
modules-left = i3 xwindow
modules-center = date
modules-right = threat vpn tor network-IP wireless volume battery power
tray-position = right
tray-padding = 2
tray-background = ${colors.background}
enable-ipc = true
wm-restack = i3
cursor-click = pointer

[bar/cyber-bottom]
monitor = ${env:MONITOR:}
bottom = true
width = 100%
height = 24
background = ${colors.background}
foreground = ${colors.foreground}
border-top-size = 1
border-color = ${colors.line}
line-size = 1
line-color = ${colors.primary}
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=13;3"
modules-left = cpu-hud memory-hud disk-hud temp
modules-center = net-speed
modules-right = connections updates theme-name clock-small
enable-ipc = true
wm-restack = i3

; ── i3 workspaces ────────────────────────────────────────────────────────
[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-foreground = ${colors.background-alt}
label-mode-background = ${colors.amber}
label-mode-padding = 1
label-focused = %name%
label-focused-foreground = ${colors.background-alt}
label-focused-background = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.accent}
label-visible-background = ${colors.line}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = #ffffff
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = ▸ %title:0:52:...%
label-foreground = ${colors.accent}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M:%S
label = %{F#00fff5}◢%{F-} %date% %{F#3d7a78}│%{F-} %time%
click-left = alacritty -e bash -c 'cal -y; read' &

[module/clock-small]
type = internal/date
interval = 5
date = %a %d %b
label = %date%

; ── Custom HUD script modules ────────────────────────────────────────────
[module/threat]
type = custom/script
exec = ~/.config/polybar/scripts/threat-level.sh
interval = 60
format-prefix = "⛨ "
click-left = alacritty -e cyberdeck dashboard defense &

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-status.sh
interval = 10
click-left = alacritty -e vpn-manager status &

[module/tor]
type = custom/script
exec = ~/.config/polybar/scripts/tor-status.sh
interval = 30
click-left = alacritty -e tor-manager status &

[module/network-IP]
type = custom/script
exec = ~/.config/polybar/scripts/network-info.sh
interval = 10
click-left = alacritty -e cyberdeck dashboard network &

[module/net-speed]
type = custom/script
exec = ~/.config/polybar/scripts/net-speed.sh
tail = true
label-maxlen = 40

[module/connections]
type = custom/script
exec = ~/.config/polybar/scripts/connections.sh
interval = 10
click-left = alacritty -e connection-monitor &

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 1800
click-left = alacritty -e update-all --check &

[module/theme-name]
type = custom/script
exec = echo "⬢ $(cat ~/.cyberdeck/theme 2>/dev/null || echo ghost)"
interval = 30
click-left = theme-switcher &

[module/cpu-hud]
type = custom/script
exec = ~/.config/polybar/scripts/cpu-bar.sh
interval = 2
click-left = alacritty -e htop &

[module/memory-hud]
type = custom/script
exec = ~/.config/polybar/scripts/mem-bar.sh
interval = 3
click-left = alacritty -e htop &

[module/disk-hud]
type = custom/script
exec = ~/.config/polybar/scripts/disk-bar.sh
interval = 60
click-left = alacritty -e disk-analyzer &

; ── Native modules ───────────────────────────────────────────────────────
[module/wireless]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
label-connected = " %essid% %signal%%"
format-disconnected =

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "♪ %percentage%%"
label-muted = "♪ MUTED"
label-muted-foreground = ${colors.muted}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
poll-interval = 10
format-charging = <label-charging>
label-charging = "⚡ %percentage%%"
format-discharging = <label-discharging>
label-discharging = "▮ %percentage%%"
format-full = <label-full>
label-full = "▮ FULL"

[module/temp]
type = internal/temperature
thermal-zone = 0
warn-temperature = 80
format = <label>
label = "🌡 %temperature-c%"
label-warn = "🌡 %temperature-c%"
label-warn-foreground = ${colors.alert}

[module/power]
type = custom/text
content = " ⏻ "
content-foreground = ${colors.alert}
click-left = ~/.config/i3/scripts/power-menu.sh &

[settings]
screenchange-reload = true
pseudo-transparency = true
