# ════════════════════════════════════════════════════════════════════════
#  CYBERDECK // tmux — prefix Ctrl-a · vim panes · HUD status line
# ════════════════════════════════════════════════════════════════════════
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc,alacritty:Tc"
set -g escape-time 0
set -g history-limit 50000
set -g mouse on
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "◢ #S · #W"
setw -g mode-keys vi
setw -g monitor-activity on
set -g visual-activity off
set -g focus-events on

# Splits keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'; unbind %

# Vim pane navigation (+ seamless with vim via same keys in .vimrc)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h previous-window
bind -r C-l next-window
bind > swap-pane -D
bind < swap-pane -U
bind z resize-pane -Z
bind x kill-pane
bind X kill-window
bind r source-file ~/.tmux.conf \; display "◢ tmux config reloaded"
bind s choose-session
bind S command-prompt -p "new session:" "new-session -s '%%'"

# Copy mode (vi) → system clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind P paste-buffer

# Dashboard shortcuts inside tmux
bind M run-shell "cyberdeck dashboard main"
bind N run-shell "cyberdeck dashboard network"
bind R run-shell "cyberdeck dashboard recon"
bind D run-shell "cyberdeck dashboard defense"

# ── HUD theme (Ghost) ─────────────────────────────────────────────────────
set -g status-style "bg=#0a0a0a,fg=#e6ffff"
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 90
set -g status-left "#[fg=#00fff5,bold]◢ #S #[fg=#3d7a78]│ #[fg=#e6ffff]#H #[fg=#3d7a78]│ #[fg=#00b8b0]#(ip -4 -o addr show scope global 2>/dev/null | awk 'NR==1{split($4,a,\"/\");print a[1]}')"
set -g status-right "#[fg=#3d7a78]│ #[fg=#00ff41]#(cut -d' ' -f1 /proc/loadavg) #[fg=#3d7a78]│ #[fg=#ffb000]#(free -m | awk '/Mem/{printf \"%d%%\", $3*100/$2}') RAM #[fg=#3d7a78]│ #[fg=#00fff5,bold]%H:%M:%S #[fg=#e6ffff]%Y-%m-%d"
setw -g window-status-format "#[fg=#3d7a78] #I:#W "
setw -g window-status-current-format "#[fg=#0a0a0a,bg=#00fff5,bold] #I:#W #[default]"
setw -g window-status-activity-style "fg=#ffb000"
set -g pane-border-style "fg=#1a2a2a"
set -g pane-active-border-style "fg=#00fff5"
set -g message-style "bg=#0a0a0a,fg=#00fff5,bold"
set -g mode-style "bg=#0f3a3a,fg=#e6ffff"
set -g clock-mode-colour "#00fff5"
setw -g clock-mode-style 24
