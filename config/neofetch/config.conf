# CYBERDECK // neofetch — custom deck logo + dense info
print_info() {
    info title
    info underline

    info "◢ DECK" "Cyberdeck-BlackArch"
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk
    info "Local IP" local_ip
    info "Public IP" public_ip

    info cols
}
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="mib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
gpu_brand="on"
refresh_rate="off"
gtk_shorthand="off"
colors=(6 6 7 6 6 7)
bold="on"
underline_enabled="on"
underline_char="─"
separator=" ▸ "
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"
bar_char_elapsed="▓"
bar_char_total="░"
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"
cpu_display="barinfo"
memory_display="barinfo"
battery_display="off"
disk_display="barinfo"
image_backend="ascii"
image_source="${XDG_CONFIG_HOME:-$HOME/.config}/neofetch/ascii-logo.txt"
ascii_distro="auto"
ascii_colors=(6 6 7)
ascii_bold="on"
image_loop="off"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3
stdout="auto"
