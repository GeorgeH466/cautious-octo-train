# Cyberdeck rifle — file openers (fallback to ranger defaults where absent)
ext x?html?, has firefox, X, flag f = firefox -- "$@"
mime ^text, label editor = ${VISUAL:-$EDITOR} -- "$@"
mime ^text, label pager = "$PAGER" -- "$@"
ext log = "$PAGER" -- "$@"
ext md|markdown, label editor = ${VISUAL:-$EDITOR} -- "$@"
ext pdf, has zathura, X, flag f = zathura -- "$@"
ext png|jpg|jpeg|gif|webp, has feh, X, flag f = feh -- "$@"
ext pcap|pcapng, has wireshark, X, flag f = wireshark -- "$@"
ext pcap|pcapng, has tshark = tshark -r "$@"
ext tar|gz|xz|zip = bsdtar -tvf "$@"
