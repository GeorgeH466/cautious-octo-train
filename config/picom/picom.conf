# CYBERDECK // picom — transparency, blur, rounded corners, subtle glow
backend = "glx";
vsync = true;
glx-no-stencil = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

# ── Rounded corners (picom with corner support; ignored harmlessly otherwise)
corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];

# ── Shadow (thin neon-tinted glow, not heavy depth)
shadow = true;
shadow-radius = 12;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-opacity = 0.45;
shadow-color = "#003b3a";
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Conky'" ];

# ── Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 4;

# ── Opacity: focused near-solid, unfocused glassy (apps set their own base)
active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 0.9;
inactive-opacity-override = false;
opacity-rule = [
  "92:class_g = 'Alacritty' && focused",
  "85:class_g = 'Alacritty' && !focused",
  "95:class_g = 'Rofi'",
  "90:class_g = 'Dunst'",
  "100:class_g = 'firefox' && focused",
  "100:fullscreen"
];

# ── Blur behind transparent windows (dual-kawase is fast on most GPUs)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Conky'" ];

# Subtle CRT-ish dimming of inactive windows keeps focus on the active pane
inactive-dim = 0.12;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
  dock    = { shadow = false; clip-shadow-above = true; };
  dnd     = { shadow = false; };
  popup_menu = { opacity = 0.92; shadow = true; };
  dropdown_menu = { opacity = 0.92; shadow = true; };
};
