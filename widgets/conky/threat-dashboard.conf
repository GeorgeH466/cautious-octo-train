-- CYBERDECK // Conky — Threat Dashboard
conky.config = {
    alignment = 'bottom_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'e6ffff',
    default_outline_color = '0a0a0a',
    default_shade_color = '0a0a0a',
    double_buffer = true,
    draw_borders = true,
    border_inner_margin = 10,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'JetBrainsMono Nerd Font:size=9',
    gap_x = 14, gap_y = 44,
    minimum_height = 5, minimum_width = 320, maximum_width = 320,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 185,
    own_window_colour = '0a0a0a',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 10.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    color1 = '00fff5', color2 = '00b8b0', color3 = '00ff41',
    color4 = 'ffb000', color5 = 'ff0040', color6 = '3d7a78',
};
conky.text = [[
${color1}┌─[ ${font JetBrainsMono Nerd Font:bold:size=10}⛨ THREAT DASHBOARD${font} ${color1}]
${color6}│${color} LEVEL ${execi 60 ~/.config/polybar/scripts/threat-level.sh | sed 's/%{[^}]*}//g'}
${color6}├─${color} FAILED SSH (1h) ${execi 60 journalctl --since '-1h' -u sshd --no-pager 2>/dev/null | grep -ci 'failed password'}
${color6}├─${color} ESTABLISHED ${execi 10 ss -tun state established | tail -n +2 | wc -l} conn
${color6}├─${color} LISTENING ${execi 60 ss -tlnH | awk '{print $4}' | grep -oE '[0-9]+$' | sort -un | paste -sd, - | head -c 40}
${color6}├─${color} FAIL2BAN ${execi 60 systemctl is-active fail2ban 2>/dev/null} · TOR ${execi 60 systemctl is-active tor 2>/dev/null}
${color6}├─${color} UPDATES PENDING ${execi 1800 pacman -Qu 2>/dev/null | wc -l}
${color6}│${color} ${color4}▲${color} latest alert:
${color6}│${color}  ${execi 60 tail -1 ~/.cyberdeck/logs/netdaemon.log 2>/dev/null | cut -c1-44}
${color1}└──
]];
