-- CYBERDECK // Conky — HUD Clock
conky.config = {
    alignment = 'top_left',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'e6ffff',
    default_outline_color = '0a0a0a',
    default_shade_color = '0a0a0a',
    double_buffer = true,
    draw_borders = true,
    border_inner_margin = 10,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'JetBrainsMono Nerd Font:size=9',
    gap_x = 14, gap_y = 44,
    minimum_height = 5, minimum_width = 320, maximum_width = 320,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 185,
    own_window_colour = '0a0a0a',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    color1 = '00fff5', color2 = '00b8b0', color3 = '00ff41',
    color4 = 'ffb000', color5 = 'ff0040', color6 = '3d7a78',
};
conky.text = [[
${color1}┌─[ ${font JetBrainsMono Nerd Font:bold:size=10}◢ CHRONO HUD${font} ${color1}]
${alignc}${color1}${font JetBrainsMono Nerd Font:size=34}${time %H:%M}${font}${color3}${font JetBrainsMono Nerd Font:size=16}:${time %S}${font}
${alignc}${color}${time %A} · ${time %d %B %Y}
${alignc}${color6}UTC ${utime %H:%M} · uptime ${uptime_short} · ${time %Z}
${color6}├─${color} ${execi 3600 cal | head -3 | tail -1}
${color6}│${color}  ${execi 3600 cal | tail -n +3 | head -1}
${color6}│${color}  ${execi 3600 cal | tail -n +4 | head -1}
${color6}│${color}  ${execi 3600 cal | tail -n +5 | head -1}
${color6}│${color}  ${execi 3600 cal | tail -n +6 | head -1}
${color1}└──
]];
