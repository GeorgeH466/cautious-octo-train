conky.text = [[
${color3}┌─[ ${font JetBrainsMono Nerd Font:bold:size=10}⬢ HEX STREAM${font} ${color3}]
${color6}│${color3} ${execi 0.5 head -c 18 /dev/urandom | od -An -tx1 | tr -s ' '}
${color6}│${color2} ${execi 0.5 head -c 18 /dev/urandom | od -An -tx1 | tr -s ' '}
${color6}│${color3} ${execi 0.5 head -c 18 /dev/urandom | od -An -tx1 | tr -s ' '}
${color6}│${color6} ${execi 0.5 head -c 18 /dev/urandom | od -An -tx1 | tr -s ' '}
${color6}│${color3} entropy ${execi 2 cat /proc/sys/kernel/random/entropy_avail} bits
${color3}└──
]];
