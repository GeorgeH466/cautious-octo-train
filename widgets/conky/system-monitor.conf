-- CYBERDECK // Conky — System Monitor
conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'e6ffff',
    default_outline_color = '0a0a0a',
    default_shade_color = '0a0a0a',
    double_buffer = true,
    draw_borders = true,
    border_inner_margin = 10,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'JetBrainsMono Nerd Font:size=9',
    gap_x = 14, gap_y = 44,
    minimum_height = 5, minimum_width = 320, maximum_width = 320,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 185,
    own_window_colour = '0a0a0a',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    color1 = '00fff5', color2 = '00b8b0', color3 = '00ff41',
    color4 = 'ffb000', color5 = 'ff0040', color6 = '3d7a78',
};
conky.text = [[
${color1}┌─[ ${font JetBrainsMono Nerd Font:bold:size=10}◢ SYSTEM MONITOR${font} ${color1}]
${color6}│${color} HOST ${nodename} · ${kernel} · up ${uptime_short}
${color6}│
${color6}├─${color} CPU  ${cpu cpu0}% ${color1}${cpubar cpu0 6,180}${color}
${color6}│${color}  ${cpugraph cpu0 28,290 00b8b0 00fff5}
${color6}├─${color} CORE1 ${cpu cpu1}% ${cpubar cpu1 4,60} CORE2 ${cpu cpu2}% ${cpubar cpu2 4,60}
${color6}├─${color} RAM  $mem / $memmax ${color1}${membar 6,150}${color} $memperc%
${color6}├─${color} SWAP $swap / $swapmax ${swapbar 4,120} $swapperc%
${color6}├─${color} DISK / ${fs_used /}/${fs_size /} ${color1}${fs_bar 6,120 /}${color} ${fs_used_perc /}%
${color6}│${color}  R ${diskio_read}  W ${diskio_write}
${color6}├─${color} LOAD ${loadavg} · PROCS $processes ($running_processes run)
${color6}│
${color6}├─${color} ${color1}TOP CPU${color}
${color6}│${color}  ${top name 1} ${top cpu 1}% · ${top name 2} ${top cpu 2}%
${color6}├─${color} ${color1}TOP RAM${color}
${color6}│${color}  ${top_mem name 1} ${top_mem mem 1}% · ${top_mem name 2} ${top_mem mem 2}%
${color1}└──
]];
